domain_standard_note: >-
  Edge AI accelerator silicon has no ratified API standard of the SCIM/OData/FHIR/OpenRTB kind, so the
  domain_standard slot is left largely empty on purpose. ONNX and GStreamer are the two interfaces the
  market actually converges on and Hailo supports both; neither is declared inside a saved contract.
