    docs-level claim, not a contract declaration — no ONNX identifier appears inside grpc/hailo-hef.proto.
- id: gstreamer
  conforms: true
  scope: media pipeline
  evidence: >-
    HailoRT ships the `hailonet` GStreamer element (hailo-ai/hailort README, LGPL-2.1-or-later), and
    hailo-ai/tappas is a GStreamer pipeline library. GStreamer is the de-facto embedded-video pipeline
