apis:
- aid: hailo-hailort
  name: HailoRT
  description: >-
    HailoRT is Hailo's production runtime library for the Hailo-8, Hailo-10 and Hailo-15 device families.
    It is a host-side, user-space C/C++ library with a Python binding (pyHailoRT), a hailortcli command
    line tool, a GStreamer element (hailonet) and a PCIe kernel driver. It is a local device API rather
    than a network API — there is no hosted HTTP base URL. The machine-readable contracts it publishes are
    Protocol Buffers definitions in the hailo-ai/hailort repository: the hRPC client/server request and
    reply scheme, the GenAI (LLM / VLM / speech / embeddings) request scheme, the HEF compiled-model file
    format, and the scheduler-monitor and tracer-profiler telemetry schemes.
  humanURL: https://hailo.ai/developer-zone/documentation/hailort/latest/
  x-base-url: none
  x-base-url-note: >-
    Deliberately no baseURL. HailoRT is a host-side library that talks to the accelerator over PCIe or
    USB through a kernel driver. There is no HTTP host to record, and repair-api-bases.py confirmed on
    2026-08-22 that no source names one. Recorded as absent rather than guessed from the domain.
  tags:
  - Inference
  - Runtime
  - Edge Computing
  - Protocol Buffers
