aid: hailo
name: Hailo
description: >-
  Hailo Technologies Ltd. is an Israeli fabless semiconductor company, headquartered in Tel Aviv with
  offices in the United States, Germany, Japan, Taiwan, China and South Korea, that designs AI inference
  accelerators (the Hailo-8, Hailo-8L and Hailo-10 families) and AI vision processors (the Hailo-15 SoC
  family) for edge devices. Its developer surface is not a hosted web API: it is an on-device software
  stack published largely on GitHub under the hailo-ai organization — HailoRT, a C/C++/Python runtime
  library plus the hailortcli command line tool and a PCIe kernel driver; the Hailo Model Zoo of
  pre-compiled HEF models; TAPPAS and hailo-apps application pipelines; and the Hailo Media Library and
  Hailo Imaging stacks for the Hailo-15 vision processor. The machine-readable contracts Hailo publishes
  are Protocol Buffers — a 33-RPC gRPC MediaLibraryService, the HailoRT hRPC and GenAI message schemes,
  the HEF model-file format, and a WebSocket/ZMQ analytics metadata scheme. Hailo also publishes a
  first-party Agent Skills package (hailo15-agentic-coding) of twelve skills that drive board connection,
  pipeline editing, model swapping, cross-compilation and deployment on the Hailo-15 SBC.
