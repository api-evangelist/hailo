- aid: hailo-media-library
  name: Hailo Media Library Service
  description: >-
    The Hailo Media Library is the C++ media and vision stack for the Hailo-15 AI vision processor. It
    exposes a real gRPC contract — service MediaLibraryService, 33 RPCs including five server-streaming
    subscriptions — covering pipeline lifecycle (Initialize, StartPipeline, StopPipeline, Shutdown),
    profile and ISP configuration, frontend output streams, thermal throttling state, and zero-copy buffer
    exchange with the encoder. A companion Protocol Buffers scheme describes the analytics metadata frames
    (detections, landmarks, classifications, tracking ids) the analytics API emits over WebSocket and ZMQ.
    The service runs on the board, so there is no public internet base URL.
  humanURL: https://github.com/hailo-ai/hailo-media-library
  x-base-url: none
  x-base-url-note: >-
    Deliberately no baseURL. MediaLibraryService is a gRPC service that runs ON the Hailo-15 board and is
    reached over a local socket, with a Unix-domain-socket side-channel for DMA buffer descriptors. There
    is no public internet host; inventing one would be a fabrication.
  tags:
  - Computer-Vision
  - Video Analytics
  - gRPC
  - Streaming
  tags_raw:
